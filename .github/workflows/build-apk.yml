name: Build Android Standalone APK

on:
  push:
    branches: [ main ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🤖 Compile FitRack Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ⚙️ Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Standalone APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: 🚚 Prepare & Rename APK
        run: |
          mkdir -p build-output
          # Look for the generated release APK, or fallback to debug APK
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/FitRack.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/FitRack.apk
          else
            # fallback if built under debug
            cd android && ./gradlew assembleDebug --no-daemon -x lint && cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/FitRack.apk
          fi

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: FitRack-Android-APK
          path: build-output/FitRack.apk
          retention-days: 30

      - name: 🚀 Attach APK to GitHub Release (If Triggered on Release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/FitRack.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
